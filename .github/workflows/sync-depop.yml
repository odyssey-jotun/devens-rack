name: Sync Depop

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-depop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
      - name: Commit new listings
        run: |
          if git diff --quiet data/listings.json; then
            echo "Shop unchanged."
            exit 0
          fi
          git config user.name "devens-rack-sync"
          git config user.email "devens-rack-sync@users.noreply.github.com"
          git add data/listings.json
          git commit -m "Sync listings from Depop"
          git push
